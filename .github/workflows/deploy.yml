name: Deploy

on:
  push:
    branches: [main]

# Give each job only the permissions it needs
permissions:
  contents: read

jobs:
  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Deploy Worker
        working-directory: worker
        run: wrangler deploy --var DEPLOY_VERSION:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke-test:
    name: Smoke-test Worker
    runs-on: ubuntu-latest
    needs: deploy-worker
    permissions: {}
    steps:
      - name: Check /api/okter returns 200
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.API_TOKEN }}" \
            https://trening-arnar.trening-arnar.workers.dev/api/okter)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: expected 200, got $STATUS"
            exit 1
          fi

  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject version into frontend
        run: sed -i "s/APP_VERSION_PLACEHOLDER/${GITHUB_SHA}/g" frontend/index.html
      - name: Push frontend to gh-pages branch
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cd frontend
          touch .nojekyll   # skip Jekyll build, serve HTML directly
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy from main@${SHORT_SHA}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages:gh-pages
