name: Deploy v2

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/deploy-v2.yml'

permissions:
  contents: read

jobs:
  deploy-worker:
    name: Deploy Worker v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Deploy Worker
        working-directory: v2/worker
        run: wrangler deploy --var DEPLOY_VERSION:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    name: Deploy Frontend v2
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inject version
        run: sed -i "s/APP_VERSION_PLACEHOLDER/${GITHUB_SHA}/g" v2/frontend/index.html
      - name: Push to gh-pages-v2 branch
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cd v2/frontend
          touch .nojekyll
          git init -b gh-pages-v2
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v2 deploy from main@${SHORT_SHA}"
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages-v2:gh-pages-v2
